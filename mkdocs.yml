site_name: mostly
site_description: A lightweight python library for building fuzzy inference systems.

repo_name: cupressus/mostly
repo_url: https://github.com/cupressus/mostly

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cupressus/mostly
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mmeyer-analyst/

plugins:
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false

nav:
  - Introduction: index.md
  - Tutorials: 
    - Membership functions: mf.ipynb
    - Tipping Problem: tipping_problem.ipynb
  - API reference:
    - Membership functions:
      - Overview: reference/membership-functions.md
      - MembershipFunction: reference/membership-functions/base.md
      - MFCrisp: reference/membership-functions/crisp.md
      - MFTriangular: reference/membership-functions/triangular.md
      - MFTrapezoidal: reference/membership-functions/trapezoidal.md
      - MFGaussian: reference/membership-functions/gaussian.md
      - MFBimodalGaussian: reference/membership-functions/bimodal-gaussian.md
      - MFGeneralizedBell: reference/membership-functions/generalized-bell.md
      - MFPolynomialS: reference/membership-functions/polynomial-s.md
      - MFPolynomialZ: reference/membership-functions/polynomial-z.md
      - MFPolynomialCombined: reference/membership-functions/polynomial-combined.md
      - MFSigmoidal: reference/membership-functions/sigmoidal.md
      - MFSigmoidalCombined: reference/membership-functions/sigmoidal-combined.md
  #- Changelog: changelog.md
  #- How-To Guides: how_to_guide.md
  #- Explanation: changelog.md